<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>PR Evidence Gallery</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- Sticky header -->
  <header class="site-header" role="banner">
    <div class="site-header__brand">
      <a href="/" class="site-header__back" aria-label="Back to all PRs">
        ← All PRs
      </a>
    </div>
    <nav class="site-header__nav" aria-label="Account navigation">
      <button
        id="sign-out-btn"
        class="btn btn--ghost"
        type="button"
        aria-label="Sign out"
      >
        Sign out
      </button>
    </nav>
  </header>

  <!-- Page body -->
  <div class="page-wrap" role="main">

    <!-- PR title + delete-all action (title is populated by pr.js) -->
    <div class="pr-page-header">
      <h1 id="pr-title" class="pr-page-header__title" aria-label="Pull request identifier">
        Loading…
      </h1>
      <div class="pr-page-header__actions">
        <button
          id="delete-pr-btn"
          class="btn btn--danger"
          type="button"
          aria-label="Delete all evidence for this PR"
          hidden
        >
          Delete all for this PR
        </button>
      </div>
    </div>

    <!-- Global error (hidden until needed) -->
    <div
      id="error-msg"
      class="alert alert--error"
      role="alert"
      aria-live="assertive"
      hidden
    ></div>

    <!-- Loading state -->
    <div id="loading-state" class="state-message" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <p style="margin-top:12px">Loading gallery…</p>
    </div>

    <!-- Empty state (hidden until confirmed empty) -->
    <div id="empty-state" class="state-message" hidden>
      <p class="state-message__title">No artifacts found</p>
      <p>This PR has no evidence yet, or it may have been deleted.</p>
    </div>

    <!-- Artifact grid (hidden until data loads; populated by pr.js) -->
    <div
      id="artifact-grid"
      class="artifact-grid"
      role="list"
      aria-label="Artifacts"
      hidden
    ></div>

  </div><!-- /.page-wrap -->

  <!--
    The lightbox overlay is injected into <body> by lightbox.js when createLightbox() runs.
    No static markup needed here.
  -->

  <script type="module" src="/js/pr.js"></script>
</body>
</html>
